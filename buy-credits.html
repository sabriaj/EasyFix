<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blej Kredi - EasyFix</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="easyfix-icons-pack/favicon.ico" sizes="any">
  <script src="i18n.js"></script>
  <script src="https://app.lemonsqueezy.com/js/lemon.js" defer></script>
  <script src="lemon.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white w-full max-w-xl rounded-2xl shadow-xl p-8">
    <div class="flex justify-end mb-4">
      <div class="inline-flex rounded-full border border-gray-200 bg-gray-50 p-1 text-xs font-extrabold text-gray-600">
        <button type="button" class="lang-option px-3 py-1 rounded-full" data-buy-lang="sq">SQ</button>
        <button type="button" class="lang-option px-3 py-1 rounded-full" data-buy-lang="mk">MK</button>
        <button type="button" class="lang-option px-3 py-1 rounded-full" data-buy-lang="en">EN</button>
      </div>
    </div>
    <h1 class="text-3xl font-extrabold text-center text-gray-900 mb-2" data-i18n="buy_credits_title">Blej Kredi</h1>
    <p class="text-center text-gray-600 mb-8" data-i18n="buy_credits_subtitle">Zgjidh paketen qe deshiron.</p>

    <div id="userBox" class="mb-6 text-center text-sm font-semibold text-gray-700"></div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <button onclick="buyCredits(1)"
        class="rounded-2xl border border-gray-200 bg-white hover:bg-gray-50 p-6 text-center shadow-sm">
        <div class="text-2xl font-black text-blue-600 mb-2">1</div>
        <div class="font-bold text-gray-900" data-i18n="credits_pack_1_title">1 Kredi</div>
      </button>

      <button onclick="buyCredits(5)"
        class="rounded-2xl border-2 border-blue-600 bg-blue-50 hover:bg-blue-100 p-6 text-center shadow-sm">
        <div class="text-2xl font-black text-blue-700 mb-2">5</div>
        <div class="font-bold text-gray-900" data-i18n="credits_pack_5_title">5 Kredi</div>
      </button>

      <button onclick="buyCredits(10)"
        class="rounded-2xl border border-gray-200 bg-white hover:bg-gray-50 p-6 text-center shadow-sm">
        <div class="text-2xl font-black text-blue-600 mb-2">10</div>
        <div class="font-bold text-gray-900" data-i18n="credits_pack_10_title">10 Kredi</div>
      </button>
    </div>

    <p id="status" class="text-center text-sm text-gray-600 mt-6"></p>

    <div class="mt-8 text-center">
      <a id="backHomeLink" href="index.html" class="inline-block text-blue-600 font-bold hover:underline" data-i18n="back">Kthehu mbrapa</a>
    </div>
  </div>

<script src="easyfix-config.js"></script>
<script src="auth-client.js"></script>
<script>
const API_URL = window.EASYFIX_CONFIG.API_URL;
const { pagePath, goToPage } = window.EASYFIX_CONFIG;
const { getUser, setUser, clearUser, apiFetch, translateApiError } = window.EASYFIX_AUTH;
const { getLang, setLang, t, applyTranslations } = window.EASYFIX_I18N;
document.getElementById("backHomeLink").href = pagePath("index.html");

function applyPageLanguage() {
  applyTranslations(document);
  document.documentElement.setAttribute("lang", getLang());
  document.title = t("buy_credits_page_title");
  document.querySelectorAll("[data-buy-lang]").forEach(btn => {
    const active = btn.getAttribute("data-buy-lang") === getLang();
    btn.className = active
      ? "lang-option px-3 py-1 rounded-full bg-white text-blue-700 shadow-sm"
      : "lang-option px-3 py-1 rounded-full hover:text-blue-700";
  });
}

document.querySelectorAll("[data-buy-lang]").forEach(btn => {
  btn.addEventListener("click", () => {
    setLang(btn.getAttribute("data-buy-lang"));
    applyPageLanguage();
    renderUserSummary();
  });
});

function showStatus(msg, isError = false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = isError
    ? "text-center text-sm text-red-600 mt-6"
    : "text-center text-sm text-gray-600 mt-6";
}

function renderUserSummary(userData) {
  const user = userData || getUser();
  if (!user) return;
  document.getElementById("userBox").innerText = t("credits_user_summary", {
    email: user.email || "",
    credits: Number(user.credits || 0)
  });
}

function updateCreditsUI(credits) {
  const user = getUser();
  if (!user) return;

  setUser({ ...user, credits });
}

async function handleSuccessReturn() {
  const params = new URLSearchParams(window.location.search);

  if (params.get("success") !== "1") return;

  const user = getUser();
  if (!user || !user.id) return;

  showStatus(t("credits_refreshing"));

  setTimeout(async () => {
    try {
      const res = await apiFetch(`${API_URL}/user/me/${user.id}`);
      const data = await res.json();

      if (!res.ok) {
        showStatus(t("credits_payment_refresh_pending"), true);
        return;
      }

      updateCreditsUI(data.user.credits);
      renderUserSummary(data.user);

      showStatus(t("credits_payment_success"));
    } catch (err) {
      console.error(err);
      showStatus(t("credits_refresh_error"), true);
    }
  }, 1500);
}

async function loadUser() {
  const user = getUser();

  if (!user || !user.id) {
    goToPage("auth.html");
    return;
  }

  if (user.role !== "client") {
    goToPage("index.html");
    return;
  }

  try {
    const res = await apiFetch(`${API_URL}/user/me/${user.id}`);
    const data = await res.json();

    if (!res.ok) {
      clearUser();
      goToPage("auth.html");
      return;
    }

    renderUserSummary(data.user);

    if (window.location.search.includes("success=1")) {
      showStatus(t("credits_payment_pending"));
      setTimeout(loadUser, 2500);
    }
  } catch (err) {
    console.error(err);
    showStatus(t("credits_user_load_error"), true);
  }
}

async function buyCredits(pack) {
  const user = getUser();

  if (!user || !user.id) {
    goToPage("auth.html");
    return;
  }

  showStatus(t("credits_connecting_payment"));

  try {
    const res = await apiFetch(`${API_URL}/credits/buy`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        userId: user.id,
        pack: pack
      })
    });

    const data = await res.json();

    if (!res.ok) {
      showStatus(translateApiError(data.error_code, "api_server_error"), true);
      return;
    }

    if (!data.checkoutUrl) {
      showStatus(t("credits_missing_checkout"), true);
      return;
    }

    window.location.href = data.checkoutUrl;
  } catch (err) {
    console.error(err);
    showStatus(t("server_error_try_later"), true);
  }
}

applyPageLanguage();
loadUser();
handleSuccessReturn();
</script>
</body>
</html>
