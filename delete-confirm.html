<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>EasyFix - Confirm Deletion</title>
  <link rel="stylesheet" href="styles.css">

  <link rel="icon" href="easyfix-icons-pack/favicon.ico" sizes="any">
  <meta name="theme-color" content="#1d4ed8">
</head>
<body class="bg-gray-50 min-h-screen">
  <header class="bg-blue-700 text-white py-6 shadow-md">
    <div class="container mx-auto px-4 flex items-center justify-between">
      <h1 class="text-2xl font-extrabold">EasyFix</h1>
      <a id="backHomeLink" href="index.html" class="underline">Back to Home</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10 max-w-2xl">
    <h2 class="text-3xl font-bold text-blue-900 mb-2">Confirm deletion</h2>
    <p class="text-gray-700 mb-6">
      This will delete your pro account and remove your listing from EasyFix. If you did not request this, close this page.
    </p>

    <div id="msg" class="hidden rounded-lg p-3 text-sm mb-4"></div>

    <div class="bg-white rounded-xl shadow p-6 space-y-4">
      <div class="text-sm text-gray-700">
        <div><b>Email:</b> <span id="emailLabel">&mdash;</span></div>
        <div class="text-xs text-gray-500 mt-2">If the link is expired, sign in and request a new one from <a id="dashboardDeleteLink" class="underline text-blue-700" href="pro-dashboard.html">Pro Dashboard Settings</a>.</div>
      </div>

      <button id="confirmBtn" class="w-full bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold">
        Confirm and delete my account
      </button>

      <a id="cancelLink" href="index.html" class="block text-center text-sm underline text-blue-700">Cancel</a>
    </div>
  </main>

  <footer class="bg-blue-700 text-white text-center py-6 mt-10">
    &copy; 2025 EasyFix
  </footer>

  <script src="easyfix-config.js"></script>
  <script src="auth-client.js"></script>
  <script>
    const { API_URL, pagePath } = window.EASYFIX_CONFIG;
    const { apiFetch } = window.EASYFIX_AUTH;
    document.getElementById("backHomeLink").href = pagePath("index.html");
    document.getElementById("cancelLink").href = pagePath("index.html");
    document.getElementById("dashboardDeleteLink").href = pagePath("pro-dashboard.html");

    const msg = document.getElementById("msg");
    const emailLabel = document.getElementById("emailLabel");
    const confirmBtn = document.getElementById("confirmBtn");

    function show(kind, text) {
      msg.classList.remove("hidden");
      msg.className = "rounded-lg p-3 text-sm mb-4 " + (kind === "ok"
        ? "bg-green-50 text-green-700 border border-green-200"
        : "bg-red-50 text-red-700 border border-red-200");
      msg.textContent = text;
    }

    function getDeleteTokenFromUrl() {
      const fromSearch = new URLSearchParams(window.location.search);
      const hashText = String(window.location.hash || "").replace(/^#/, "");
      const fromHash = new URLSearchParams(hashText);
      const candidates = [
        fromSearch.get("token"),
        fromSearch.get("delete_token"),
        fromSearch.get("t"),
        fromHash.get("token"),
        fromHash.get("delete_token"),
        fromHash.get("t")
      ];
      return String(candidates.find(Boolean) || "").trim();
    }

    let token = getDeleteTokenFromUrl();

    async function startDeleteSession() {
      try {
        window.history.replaceState({}, document.title, pagePath("delete-confirm.html"));
        const r = await apiFetch(`${API_URL}/delete/session`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token })
        });

        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.success) {
          confirmBtn.disabled = true;
          confirmBtn.classList.add("opacity-60");
          show("err", j?.error || "Invalid or expired link. Please request a new one.");
          return;
        }

        emailLabel.textContent = j.email || "—";
        token = "";
        confirmBtn.disabled = false;
        confirmBtn.classList.remove("opacity-60");
        msg.classList.add("hidden");
      } catch (e) {
        confirmBtn.disabled = true;
        confirmBtn.classList.add("opacity-60");
        show("err", "Network error. Please try again.");
      }
    }

    if (!token) {
      confirmBtn.disabled = true;
      confirmBtn.classList.add("opacity-60");
      show("err", "Missing token. Please request a new deletion link.");
    } else {
      confirmBtn.disabled = true;
      confirmBtn.classList.add("opacity-60");
      show("ok", "Verifying link...");
      startDeleteSession();
    }

    confirmBtn.addEventListener("click", async () => {
      if (token) return;

      confirmBtn.disabled = true;
      confirmBtn.classList.add("opacity-70");
      show("ok", "Deleting...");

      try {
        const r = await apiFetch(`${API_URL}/delete-confirm`, {
          method: "POST"
        });

        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.success) {
          show("err", j?.error || "Deletion failed.");
          confirmBtn.disabled = false;
          confirmBtn.classList.remove("opacity-70");
          return;
        }

        show("ok", "Deleted successfully. You can close this page.");
        confirmBtn.textContent = "Deleted";
      } catch (e) {
        show("err", "Network error. Please try again.");
        confirmBtn.disabled = false;
        confirmBtn.classList.remove("opacity-70");
      }
    });
  </script>
</body>
</html>
