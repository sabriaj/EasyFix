<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyFix - Forgot Password</title>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="easyfix-config.js"></script>
  <script src="auth-client.js"></script>
  <link rel="icon" href="easyfix-icons-pack/favicon.ico" sizes="any">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900">EasyFix</h1>
      <p class="text-sm text-gray-600 mt-2" data-i18n="forgot_password_subtitle">We will send a reset code to your email.</p>
    </div>
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-5" data-i18n="forgot_password_title">Forgot password</h2>
    <div id="statusBox" class="hidden mb-4 rounded-xl px-4 py-3 text-sm font-semibold"></div>
    <form id="forgotForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="email">Email</label>
        <input id="email" type="email" autocomplete="email" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
      </div>
      <button id="submitBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-bold transition" data-i18n="send_code_btn">Send code</button>
    </form>
    <div class="text-center mt-5">
      <a id="loginLink" href="login.html" class="text-sm text-gray-500 hover:text-gray-700" data-i18n="back_to_login">Back to login</a>
    </div>
  </main>
  <script>
    const API_URL = window.EASYFIX_CONFIG.API_URL;
    const { pagePath, goToPage } = window.EASYFIX_CONFIG;
    const { t, applyTranslations, getLang } = window.EASYFIX_I18N;
    const { apiAuthFetch, translateApiError } = window.EASYFIX_AUTH;

    function showStatus(message, type = "error") {
      const box = document.getElementById("statusBox");
      box.classList.remove("hidden");
      box.className = type === "success"
        ? "mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-green-100 text-green-700"
        : type === "info"
          ? "mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-blue-100 text-blue-700"
          : "mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-red-100 text-red-700";
      box.textContent = message;
    }

    document.getElementById("loginLink").href = pagePath("login.html");
    applyTranslations(document);
    document.documentElement.setAttribute("lang", getLang());

    document.getElementById("forgotForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const email = document.getElementById("email").value.trim().toLowerCase();
      if (!email) {
        showStatus(t("api_missing_email"));
        return;
      }
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = t("msg_sending_code");
      try {
        const res = await apiAuthFetch(`${API_URL}/auth/password/forgot`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(translateApiError(data.error_code, "api_server_error"));
          return;
        }
        showStatus(t("password_reset_code_sent"), "success");
        window.sessionStorage.setItem("easyfix_reset_email", email);
        window.sessionStorage.removeItem("easyfix_reset_code");
        window.sessionStorage.removeItem("easyfix_reset_token");
        setTimeout(() => goToPage(`reset-code.html?email=${encodeURIComponent(email)}`), 700);
      } catch (err) {
        console.error(err);
        showStatus(t("api_server_error"));
      } finally {
        btn.disabled = false;
        btn.textContent = t("send_code_btn");
      }
    });
  </script>
</body>
</html>
