<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EasyFix - New Password</title>
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js"></script>
  <script src="easyfix-config.js"></script>
  <script src="auth-client.js"></script>
  <link rel="icon" href="easyfix-icons-pack/favicon.ico" sizes="any">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-3xl shadow-xl p-6 sm:p-8">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-extrabold text-gray-900">EasyFix</h1>
      <p class="text-sm text-gray-600 mt-2" data-i18n="reset_password_subtitle">Set a new password for your account.</p>
    </div>
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-5" data-i18n="reset_password_title">New password</h2>
    <div id="statusBox" class="hidden mb-4 rounded-xl px-4 py-3 text-sm font-semibold"></div>
    <form id="resetForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="password_label">Password</label>
        <input id="password" type="password" autocomplete="new-password" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1" data-i18n="confirm_password_label">Confirm password</label>
        <input id="confirmPassword" type="password" autocomplete="new-password" class="w-full border border-gray-300 rounded-xl px-4 py-3 outline-none focus:border-blue-500">
      </div>
      <button id="submitBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded-xl py-3 font-bold transition" data-i18n="reset_password_button">Set new password</button>
    </form>
  </main>
  <script>
    const API_URL = window.EASYFIX_CONFIG.API_URL;
    const { goToPage } = window.EASYFIX_CONFIG;
    const { t, applyTranslations, getLang } = window.EASYFIX_I18N;
    const { apiAuthFetch, translateApiError } = window.EASYFIX_AUTH;
    const params = new URLSearchParams(window.location.search);
    const email = (
      String(params.get("email") || "").trim().toLowerCase() ||
      String(window.sessionStorage.getItem("easyfix_reset_email") || "").trim().toLowerCase()
    );
    const resetToken = (
      String(params.get("token") || "").trim() ||
      String(window.sessionStorage.getItem("easyfix_reset_token") || "").trim()
    );
    const code = String(window.sessionStorage.getItem("easyfix_reset_code") || resetToken || "").trim();

    function showStatus(message, type = "error") {
      const box = document.getElementById("statusBox");
      box.classList.remove("hidden");
      box.className = type === "success"
        ? "mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-green-100 text-green-700"
        : type === "info"
          ? "mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-blue-100 text-blue-700"
          : "mb-4 rounded-xl px-4 py-3 text-sm font-semibold bg-red-100 text-red-700";
      box.textContent = message;
    }

    applyTranslations(document);
    document.documentElement.setAttribute("lang", getLang());

    if (!email || !resetToken) {
      showStatus(t("api_no_active_code"));
    }

    document.getElementById("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      console.log({ email, code, password, confirmPassword });
      if (!email || !resetToken || !password || !confirmPassword) {
        showStatus(t("api_missing_fields"));
        return;
      }
      if (password.length < 6) {
        showStatus(t("login_password_min"));
        return;
      }
      if (password !== confirmPassword) {
        showStatus(t("login_password_mismatch"));
        return;
      }
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = t("account_changing_password");
      try {
        const res = await apiAuthFetch(`${API_URL}/auth/password/reset`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            resetToken,
            code,
            password,
            confirmPassword
          })
        });
        const data = await res.json();
        if (!res.ok) {
          showStatus(translateApiError(data.error_code, "account_password_change_error"));
          return;
        }
        window.sessionStorage.removeItem("easyfix_reset_email");
        window.sessionStorage.removeItem("easyfix_reset_code");
        window.sessionStorage.removeItem("easyfix_reset_token");
        showStatus(t("password_reset_success"), "success");
        setTimeout(() => goToPage("login.html"), 900);
      } catch (err) {
        console.error(err);
        showStatus(t("api_server_error"));
      } finally {
        btn.disabled = false;
        btn.textContent = t("reset_password_button");
      }
    });
  </script>
</body>
</html>
